<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Nunchaku W4A4 weight packing flow</title>
  <desc id="desc">Four aligned stages: logical quantized codes, 128 by 128 tile reorder, register packing, and final qweight tensor.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" viewBox="0 0 9 9">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .heading { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 17px Arial, sans-serif; fill: #475569; }
      .title { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #475569; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .mono { font: 14px "Courier New", monospace; fill: #0f172a; }
      .chip { fill: #f8fafc; stroke: #b8c6d8; stroke-width: 1.2; }
      .blue { fill: #dbeafe; stroke: #2563eb; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .yellow { fill: #fef3c7; stroke: #d97706; }
      .purple { fill: #f3e8ff; stroke: #9333ea; }
      .red { fill: #fee2e2; stroke: #dc2626; }
      .gray { fill: #e2e8f0; stroke: #64748b; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .callout { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="page" width="1400" height="760"/>
  <text class="heading" x="48" y="54">Nunchaku W4A4 Weight Packing</text>
  <text class="subtitle" x="48" y="84">The exported tensor shape can look familiar, but the bytes must be reordered for the CUDA kernel.</text>

  <g id="stage1" transform="translate(48 132)">
    <rect class="panel" x="0" y="0" width="280" height="460" rx="16"/>
    <text class="title" x="24" y="42">1. Logical codes</text>
    <text class="text" x="24" y="70">row-major [out, in] 4-bit codes</text>

    <g transform="translate(44 116)">
      <rect class="blue" x="0" y="0" width="42" height="34" rx="5"/>
      <rect class="green" x="48" y="0" width="42" height="34" rx="5"/>
      <rect class="yellow" x="96" y="0" width="42" height="34" rx="5"/>
      <rect class="purple" x="144" y="0" width="42" height="34" rx="5"/>
      <rect class="green" x="0" y="40" width="42" height="34" rx="5"/>
      <rect class="yellow" x="48" y="40" width="42" height="34" rx="5"/>
      <rect class="purple" x="96" y="40" width="42" height="34" rx="5"/>
      <rect class="blue" x="144" y="40" width="42" height="34" rx="5"/>
      <rect class="yellow" x="0" y="80" width="42" height="34" rx="5"/>
      <rect class="purple" x="48" y="80" width="42" height="34" rx="5"/>
      <rect class="blue" x="96" y="80" width="42" height="34" rx="5"/>
      <rect class="green" x="144" y="80" width="42" height="34" rx="5"/>
      <rect class="purple" x="0" y="120" width="42" height="34" rx="5"/>
      <rect class="blue" x="48" y="120" width="42" height="34" rx="5"/>
      <rect class="green" x="96" y="120" width="42" height="34" rx="5"/>
      <rect class="yellow" x="144" y="120" width="42" height="34" rx="5"/>
      <rect class="blue" x="0" y="160" width="42" height="34" rx="5"/>
      <rect class="green" x="48" y="160" width="42" height="34" rx="5"/>
      <rect class="yellow" x="96" y="160" width="42" height="34" rx="5"/>
      <rect class="purple" x="144" y="160" width="42" height="34" rx="5"/>
      <text class="mono" x="10" y="22">c00</text><text class="mono" x="58" y="22">c01</text><text class="mono" x="106" y="22">c02</text><text class="mono" x="154" y="22">c03</text>
      <text class="mono" x="10" y="62">c10</text><text class="mono" x="58" y="62">c11</text><text class="mono" x="106" y="62">c12</text><text class="mono" x="154" y="62">c13</text>
      <text class="mono" x="10" y="102">c20</text><text class="mono" x="58" y="102">c21</text><text class="mono" x="106" y="102">c22</text><text class="mono" x="154" y="102">c23</text>
      <text class="mono" x="10" y="142">c30</text><text class="mono" x="58" y="142">c31</text><text class="mono" x="106" y="142">c32</text><text class="mono" x="154" y="142">c33</text>
      <text class="mono" x="10" y="182">c40</text><text class="mono" x="58" y="182">c41</text><text class="mono" x="106" y="182">c42</text><text class="mono" x="154" y="182">c43</text>
    </g>
    <text class="small" x="24" y="378">Simple nibble packing keeps this order.</text>
    <text class="small" x="24" y="402">Nunchaku packing reorders it.</text>
  </g>

  <path class="arrow" d="M348 362 L398 362"/>

  <g id="stage2" transform="translate(418 132)">
    <rect class="panel" x="0" y="0" width="280" height="460" rx="16"/>
    <text class="title" x="24" y="42">2. Tile reorder</text>
    <text class="text" x="24" y="70">pad to kernel tile multiples</text>

    <g transform="translate(44 128)">
      <rect class="blue" x="0" y="0" width="92" height="78" rx="8"/>
      <rect class="green" x="104" y="0" width="92" height="78" rx="8"/>
      <rect class="yellow" x="0" y="90" width="92" height="78" rx="8"/>
      <rect class="red" x="104" y="90" width="92" height="78" rx="8"/>
      <text class="title" x="16" y="48">128</text>
      <text class="title" x="120" y="48">128</text>
      <text class="title" x="16" y="138">128</text>
      <text class="title" x="120" y="138">128</text>
    </g>
    <text class="mono" x="36" y="354">reshape -> permute</text>
    <text class="small" x="36" y="382">axes: tile, lane, pack, register</text>
  </g>

  <path class="arrow" d="M718 362 L768 362"/>

  <g id="stage3" transform="translate(788 132)">
    <rect class="panel" x="0" y="0" width="280" height="460" rx="16"/>
    <text class="title" x="24" y="42">3. Register packing</text>
    <text class="text" x="24" y="70">eight nibbles become one int32</text>

    <g transform="translate(30 146)">
      <rect class="gray" x="0" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="28" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="56" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="84" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="112" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="140" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="168" y="0" width="24" height="42" rx="4"/>
      <rect class="gray" x="196" y="0" width="24" height="42" rx="4"/>
      <text class="small" x="5" y="27">c0</text><text class="small" x="33" y="27">c1</text><text class="small" x="61" y="27">c2</text><text class="small" x="89" y="27">c3</text>
      <text class="small" x="117" y="27">c4</text><text class="small" x="145" y="27">c5</text><text class="small" x="173" y="27">c6</text><text class="small" x="201" y="27">c7</text>
      <path class="arrow" d="M110 62 L110 108"/>
      <rect class="red" x="28" y="128" width="164" height="54" rx="10"/>
      <text class="mono" x="50" y="161">one int32 word</text>
    </g>
    <text class="mono" x="36" y="354">code_i &lt;&lt; (4 * i)</text>
    <text class="small" x="36" y="382">then view storage as int8</text>
  </g>

  <path class="arrow" d="M1088 362 L1138 362"/>

  <g id="stage4" transform="translate(1158 132)">
    <rect class="panel" x="0" y="0" width="194" height="460" rx="16"/>
    <text class="title" x="24" y="42">4. qweight</text>
    <text class="text" x="24" y="70">kernel byte order</text>
    <rect class="blue" x="28" y="154" width="138" height="82" rx="12"/>
    <text class="title" x="55" y="203">qweight</text>
    <text class="mono" x="24" y="302">[out, in/2]</text>
    <text class="mono" x="24" y="332">torch.int8</text>
  </g>

  <rect class="callout" x="48" y="642" width="1304" height="66" rx="16"/>
  <text class="title" x="78" y="683">Rule of thumb:</text>
  <text class="subtitle" x="258" y="683">shape-compatible is not enough; Nunchaku also requires the exact tiled byte order.</text>
</svg>
