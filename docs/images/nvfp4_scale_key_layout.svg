<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">NVFP4 scale key layout</title>
  <desc id="desc">NVFP4 equation and comparison between scalar wtscale for single targets and expanded wcscales for fused QKV targets.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" viewBox="0 0 9 9">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .heading { font: 700 32px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 17px Arial, sans-serif; fill: #475569; }
      .title { font: 700 21px Arial, sans-serif; fill: #0f172a; }
      .text { font: 15px Arial, sans-serif; fill: #475569; }
      .mono { font: 14px "Courier New", monospace; fill: #0f172a; }
      .blue { fill: #dbeafe; stroke: #2563eb; }
      .green { fill: #dcfce7; stroke: #16a34a; }
      .yellow { fill: #fef3c7; stroke: #d97706; }
      .purple { fill: #f3e8ff; stroke: #9333ea; }
      .red { fill: #fee2e2; stroke: #dc2626; }
      .teal { fill: #ccfbf1; stroke: #0f766e; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .callout { fill: #ecfdf5; stroke: #bbf7d0; stroke-width: 1.5; }
      .op { font: 700 34px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="page" width="1400" height="760"/>
  <text class="heading" x="48" y="54">NVFP4 Scale Key Layout</text>
  <text class="subtitle" x="48" y="84">FP4 code x FP8 micro scale x BF16 outer scale reconstructs each residual weight.</text>

  <g id="equation" transform="translate(48 126)">
    <rect class="panel" x="0" y="0" width="1304" height="168" rx="16"/>
    <rect class="blue" x="56" y="56" width="220" height="66" rx="12"/>
    <text class="title" x="108" y="84">FP4 code</text>
    <text class="text" x="128" y="108">qweight</text>
    <text class="op" x="316" y="100">x</text>
    <rect class="green" x="374" y="56" width="250" height="66" rx="12"/>
    <text class="title" x="420" y="84">FP8 micro scale</text>
    <text class="text" x="432" y="108">wscales, group 16</text>
    <text class="op" x="662" y="100">x</text>
    <rect class="yellow" x="720" y="56" width="250" height="66" rx="12"/>
    <text class="title" x="762" y="84">BF16 outer scale</text>
    <text class="text" x="782" y="108">wtscale or wcscales</text>
    <text class="op" x="1010" y="100">=</text>
    <rect class="purple" x="1072" y="56" width="180" height="66" rx="12"/>
    <text class="title" x="1112" y="84">residual</text>
    <text class="text" x="1122" y="108">weight</text>
  </g>

  <g id="single" transform="translate(48 340)">
    <rect class="panel" x="0" y="0" width="600" height="280" rx="16"/>
    <text class="title" x="28" y="42">Single linear target</text>
    <text class="text" x="28" y="70">one scalar outer scale is enough for the whole tensor</text>
    <rect class="blue" x="56" y="120" width="140" height="58" rx="10"/>
    <text class="mono" x="92" y="154">qweight</text>
    <path class="arrow" d="M210 149 L250 149"/>
    <rect class="green" x="264" y="120" width="140" height="58" rx="10"/>
    <text class="mono" x="298" y="154">wscales</text>
    <path class="arrow" d="M418 149 L458 149"/>
    <rect class="yellow" x="472" y="120" width="96" height="58" rx="10"/>
    <text class="mono" x="488" y="154">wtscale</text>
    <text class="text" x="56" y="228">checkpoint has scalar BF16 `wtscale`</text>
  </g>

  <g id="fused" transform="translate(752 340)">
    <rect class="panel" x="0" y="0" width="600" height="280" rx="16"/>
    <text class="title" x="28" y="42">Fused QKV-style target</text>
    <text class="text" x="28" y="70">outer scale is expanded over output row regions</text>
    <rect class="teal" x="52" y="106" width="150" height="52" rx="8"/>
    <rect class="red" x="202" y="106" width="150" height="52" rx="8"/>
    <rect class="purple" x="352" y="106" width="150" height="52" rx="8"/>
    <text class="title" x="105" y="140">Q</text>
    <text class="title" x="255" y="140">K</text>
    <text class="title" x="405" y="140">V</text>
    <path class="arrow" d="M277 174 L277 204"/>
    <rect class="yellow" x="88" y="216" width="380" height="46" rx="10"/>
    <text class="mono" x="174" y="245">wcscales over output rows</text>
  </g>

  <rect class="callout" x="48" y="660" width="1304" height="62" rx="16"/>
  <text class="title" x="78" y="699" fill="#14532d">DeepCompressor parity:</text>
  <text class="subtitle" x="342" y="699" fill="#14532d">single targets use wtscale; fused row groups use wcscales; both use FP8 micro wscales.</text>
</svg>
