<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="180 20 640 140" role="img" aria-labelledby="title desc">
  <title id="title">diffuse_compressor logo</title>
  <desc id="desc">A diffusion field compressed through a bottleneck into compact quantized blocks beside the diffuse compressor wordmark.</desc>
  <defs>
    <linearGradient id="logo-bg" x1="180" y1="20" x2="820" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10141f"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="softShadow" x="-12%" y="-22%" width="124%" height="144%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="180" y="20" width="640" height="140" rx="24" fill="url(#logo-bg)" opacity=".72"/>
  <g transform="translate(210 50)" filter="url(#softShadow)">
    <circle cx="22" cy="45" r="13" fill="#22c7a9" opacity="0.82"/>
    <circle cx="45" cy="67" r="17" fill="#5c7cfa" opacity="0.72"/>
    <circle cx="18" cy="82" r="7" fill="#10141f" opacity="0.58"/>
    <circle cx="62" cy="39" r="8" fill="#10141f" opacity="0.72"/>
    <path d="M72 58 H86" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <polygon points="92,38 119,49 119,67 92,78" fill="#22c7a9"/>
    <polygon points="119,49 146,38 146,78 119,67" fill="#5c7cfa"/>
    <path d="M92 38 L119 49 L119 67 L92 78 Z M119 49 L146 38 L146 78 L119 67 Z" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M152 58 H160" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <rect x="166" y="40" width="13" height="13" rx="3" fill="#22c7a9"/>
    <rect x="183" y="40" width="13" height="13" rx="3" fill="#5c7cfa"/>
    <rect x="166" y="57" width="13" height="13" rx="3" fill="#5c7cfa"/>
    <rect x="183" y="57" width="13" height="13" rx="3" fill="#ef476f"/>
  </g>

  <g transform="translate(432 69)">
    <g aria-label="diffuse compressor">
      <text x="0" y="34" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="740" letter-spacing="0">d</text>
      <text x="27" y="34" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="29" font-weight="400">🧨</text>
      <text x="59" y="34" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="740" letter-spacing="0">ffuse</text>
      <text x="165" y="34" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="740" letter-spacing="0">compressor</text>
    </g>
    <text x="2" y="70" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="520" letter-spacing="0.6">MODEL-AGNOSTIC SVDQUANT TOOLKIT</text>
  </g>
