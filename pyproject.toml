[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffuse-compressor"
version = "0.1.0"
description = "Model-agnostic diffusion SVDQuant utilities with Nunchaku export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil",
  "safetensors",
  "torch",
]

[project.optional-dependencies]
dev = [
  "build",
  "pytest",
]
test = [
  "pytest",
]
eval = [
  "datasets",
  "Pillow",
  "PyYAML",
  "clean-fid",
  "image-reward",
  "clip @ git+https://github.com/openai/CLIP.git",
  "torchmetrics",
  "torchvision",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffuse_compressor*"]

[tool.setuptools.package-data]
diffuse_compressor = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
